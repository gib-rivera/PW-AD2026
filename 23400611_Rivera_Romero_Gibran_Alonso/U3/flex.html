<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejemplo Flex</title>
        <style>
            .navbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: powderblue;
                padding: 15px 25px;
            }

            .menu {
                display: flex;
                gap: 20px;
            }

            .menu a {
                color: black;
                text-decoration: none;
            }
        </style>        
    </head>
    <body>
        <nav class="navbar">
            <h2 style="color: tomato; background-color: black;">Mi Página</h2>
            <div class="menu">
                <a href="#">Inicio</a>
                <a href="#">Productos</a>
                <a href="#">Contacto</a>
            </div>
        </nav>
    </body>
</html>
