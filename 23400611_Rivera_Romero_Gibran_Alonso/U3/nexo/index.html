<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>NEXO - Inicio de sesión</title>
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <main class="contenedor">
            <section class="panel-login">
                <div class="tarjeta">
                    <img class="logo" src="./img/logoNexo.png">
                    <div class="bienvenida">
                        <h2>Buenos días</h2>
                        <p>Ingresa tus credenciales para continuar</p>
                    </div>
                    <div class="campo">
                        <label>Usuario</label>
                        <div class="input-contenedor">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <circle cx="12" cy="8" r="4" /> <path d="M5 21v-2a7 7 0 0 1 14 0v2" /> </svg>
                            <input type="text" placeholder="Ingresa tu usuario">
                        </div>
                    <div class="campo">
                        <label>Contraseña</label>
                        <div class="input-contenedor">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <rect x="3" y="11" width="18" height="11" rx="2" /> <path d="M7 11V7a5 5 0 0 1 10 0v4" /> </svg>
                            <input type="text" placeholder="Ingresa tu contraseña">
                        </div>
                    </div>
                </div>
            </section>
            <section class="panel-insititucional">
                <div class="contenido-institucional">
                    <img src="./img/logosTec.png">
                    <h2>Bienvenido(a) al sistema NEXO</h2>
                    <p>
                        Tu plataforma integral de servicios académicos del Instituto Tecnológico de Tepic
                    </p>
                </div>
            </section>
        </main>
    </body>
</html>
